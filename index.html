<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Flowers for Someone - Slide Example</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Ganti sesuai file CSS-mu -->
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #111;
            min-height: 100vh;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s, visibility 0.6s;
        }
        .slide1 {
            background: #111;
            color: #fff;
            z-index: 1;
        }
        .slide2 {
            background: #111;
            color: #fff;
            z-index: 2;
            opacity: 0;
            visibility: hidden;
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
        }
        .slide.inactive {
            opacity: 0;
            visibility: hidden;
        }
        .title {
            font-size: 2.6rem;
            font-weight: 600;
            margin-bottom: 48px;
            text-shadow: 0 2px 10px #fff6;
        }
        .opener {
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: bold;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 18px;
            box-shadow: 0 3px 18px #0005;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .opener:hover {
            background: #333;
            box-shadow: 0 5px 28px #fff2;
        }
        .love-text {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 32px;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px #fff2;
            animation: fadeInText 1.3s;
        }
        @keyframes fadeInText {
            from { opacity: 0; letter-spacing: 30px;}
            to {opacity: 1; letter-spacing: 2px;}
        }
        .flowers {
            display: flex;
            gap: 2rem;
        }
        .flower {
            width: 80px;
            height: 120px;
            position: relative;
            animation: sway 2.5s infinite alternate ease-in-out;
        }
        .flower:nth-child(2) {
            animation-delay: 1s;
        }
        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 8px;
            height: 70px;
            background: #fff;
            border-radius: 4px;
            transform: translateX(-50%);
            opacity: 0.8;
        }
        .petal {
            position: absolute;
            top: 15px;
            left: 50%;
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50% 50% 0 0;
            transform: translateX(-50%) rotate(var(--angle));
            box-shadow: 0 4px 8px #fff4;
            opacity: 0.92;
        }
        .petal:nth-child(2) { --angle: 60deg; }
        .petal:nth-child(3) { --angle: 120deg; }
        .petal:nth-child(4) { --angle: 180deg; }
        .petal:nth-child(5) { --angle: 240deg; }
        .petal:nth-child(6) { --angle: 300deg; }
        .center {
            position: absolute;
            top: 32px;
            left: 50%;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 12px #fff8;
            opacity: 0.96;
        }
        @keyframes sway {
            to { transform: rotate(8deg) scale(1.07); }
        }
    </style>
</head>
<body>
    <!-- SLIDE 1 -->
    <div class="slide slide1 active" id="slide1">
        <div class="title">I have something</div>
        <button class="opener" id="openBtn">Open</button>
    </div>
    <!-- SLIDE 2 -->
    <div class="slide slide2" id="slide2">
        <div class="love-text">I love you aisss</div>
        <div class="flowers">
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
                <div class="stem"></div>
            </div>
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
                <div class="stem"></div>
            </div>
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
                <div class="stem"></div>
            </div>
        </div>
    </div>
    <script>
        const openBtn = document.getElementById('openBtn');
        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        openBtn.onclick = function() {
            slide1.classList.remove('active');
            slide1.classList.add('inactive');
            slide2.classList.add('active');
        }
    </script>
</body>
</html>
